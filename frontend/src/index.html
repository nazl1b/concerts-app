<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Concerts</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Picks the theme BEFORE Angular loads, so the wrong theme never flashes for a moment.
    // First the choice saved with the toggle, otherwise the system setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
