<!-- Two-position switch. aria-pressed tells screen readers which position is active. -->
<div class="switch" role="group" aria-label="Color theme">
  <button
    type="button"
    [class.active]="theme.scheme() === 'dark'"
    [attr.aria-pressed]="theme.scheme() === 'dark'"
    (click)="theme.set('dark')"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
    Dark
  </button>
  <button
    type="button"
    [class.active]="theme.scheme() === 'light'"
    [attr.aria-pressed]="theme.scheme() === 'light'"
    (click)="theme.set('light')"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    Light
  </button>
</div>
